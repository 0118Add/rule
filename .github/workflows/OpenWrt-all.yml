name: OpenWrt_all

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: '🎯 选择编译目标设备'
        required: true
        default: 'openwrt'
        type: choice
        options:
          - 'immortalwrt-master'
          - 'immortalwrt-25.12'
          - 'openwrt-main'
          - 'openwrt-25.12'
          - 'lienol'       

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_NAME: openwrt
  DIY_P1_SH: scripts/sh/immortalwrt_diy-part1.sh
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@main

    - name: 2. 初始化设备环境变量
      run: |
        ID="${{ github.event.inputs.target_device }}"
        echo "TARGET_ID=$ID" >> $GITHUB_ENV
        echo "WEEK_ID=$(date +'%Y-%V')" >> $GITHUB_ENV

        if [[ "$ID" == "immortalwrt-master" ]]; then
          echo "REPO_URL=https://github.com/immortalwrt/immortalwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=master" >> $GITHUB_ENV
          echo "CONFIG_FILE=configs/immortalwrt_master.config" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*generic-rootfs.tar.gz" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*squashfs-combined-*.img.gz" >> $GITHUB_ENV
          echo "DIY_P2_SH=scripts/immortalwrt_master.sh" >> $GITHUB_ENV

        elif [[ "$ID" == "immortalwrt-25.12" ]]; then
          echo "REPO_URL=https://github.com/immortalwrt/immortalwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=v25.12.2" >> $GITHUB_ENV
          echo "CONFIG_FILE=configs/immortalwrt_25.12.config" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*generic-rootfs.tar.gz" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*squashfs-combined-*.img.gz" >> $GITHUB_ENV
          echo "DIY_P2_SH=scripts/immortalwrt_25.12.sh" >> $GITHUB_ENV
        
        elif [[ "$ID" == "openwrt-main" ]]; then
          echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=main" >> $GITHUB_ENV
          echo "CONFIG_FILE=configs/openwrt_main.config" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*generic-rootfs.tar.gz" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*squashfs-combined-*.img.gz" >> $GITHUB_ENV
          echo "DIY_P2_SH=scripts/openwrt_main.sh" >> $GITHUB_ENV
        
        elif [[ "$ID" == "openwrt-25.12" ]]; then
          echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=v25.12.6" >> $GITHUB_ENV
          echo "CONFIG_FILE=configs/openwrt_25.12.config" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*generic-rootfs.tar.gz" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*squashfs-combined-*.img.gz" >> $GITHUB_ENV
          echo "DIY_P2_SH=scripts/openwrt_25.12.sh" >> $GITHUB_ENV
        
        elif [[ "$ID" == "lienol" ]]; then
          echo "REPO_URL=https://github.com/Lienol/openwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=25.12" >> $GITHUB_ENV
          echo "CONFIG_FILE=configs/lienol.config" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*generic-rootfs.tar.gz" >> $GITHUB_ENV
          echo "TARGET_PATTERN=*squashfs-combined-*.img.gz" >> $GITHUB_ENV
          echo "DIY_P2_SH=scripts/lienol.sh" >> $GITHUB_ENV
        fi

    - name: 3. 空间清理与 I/O 优化
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 4. 环境部署
      run: |
        # 清理 Ubuntu 24.04 残留的超大无用目录
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get remove -y needrestart || true
        
        sudo -E apt-get -qq update
        DEPS=$(curl -fsSL https://raw.githubusercontent.com/free-diy/openwrt/main/depends_ubuntu || echo "")
        if [ -z "$DEPS" ]; then
          DEPS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev golang-go gperf haveged help2man intltool lib32gcc-s1 libbpf-dev libc6-dev-i386 libclang-dev libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build npm p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd"
        fi

        sudo -E apt-get -qq install -y --no-install-recommends \
          -o Dpkg::Options::="--force-confdef" \
          -o Dpkg::Options::="--force-confold" \
          $DEPS
        
        sudo -E apt-get -qq autoremove --purge && sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo npm install -g pnpm

    - name: 5. 克隆源码与环境准备
      run: |
        echo "⏳ 正在克隆仓库: $REPO_URL (分支: $REPO_BRANCH)..."
        
        # 使用 timeout 命令限制 5 分钟内必须完成，防止无限死卡
        timeout 300 git clone -b $REPO_BRANCH --single-branch --depth 1 $REPO_URL $OPENWRT_NAME || {
          echo "❌ 错误: 源码克隆超时或失败！可能是 GitHub 访问外部仓库网络不通或被限速。"
          exit 1
        }
        
        echo "OPENWRT_PATH=${GITHUB_WORKSPACE}/${OPENWRT_NAME}" >> $GITHUB_ENV
        cd "$OPENWRT_NAME"
        echo "COMMIT_DATE=$(git show -s --date=short --format='%ci' | awk '{print $1}')" >> $GITHUB_ENV
        echo "REPO_HASH=$(echo $REPO_URL | md5sum | head -c 8)" >> $GITHUB_ENV

#    - name: 6. 缓存 dl 目录
#      uses: actions/cache@v4
#      with:
#        path: ${{ env.OPENWRT_PATH }}/dl
#        key: ${{ env.WEEK_ID }}-global-${{ env.REPO_BRANCH }}-dl-${{ hashFiles('openwrt/include/version.mk', 'openwrt/feeds.conf.default') }}
#        restore-keys: |
#          ${{ env.WEEK_ID }}-global-${{ env.REPO_BRANCH }}-dl-

    - name: 7. 缓存管理 (CCache)
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: true
        mixkey: ${{ env.WEEK_ID }}-${{ env.REPO_BRANCH }}-${{ env.TARGET_ID }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: 8. 插件集成与动态感知
      env:
        CCACHE_BASEDIR: ${{ github.workspace }}
      run: |
        cd "${{ env.OPENWRT_PATH }}"

        export GOTOOLCHAIN=auto
        export GOPROXY=https://proxy.golang.org,direct
        
        FULL_VER=$(grep "VERSION_NUMBER:=" include/version.mk | grep -oE "[0-9][0-9.]*[0-9]" | head -n1)
        [ -z "$FULL_VER" ] && FULL_VER=$(grep "VERSION_CODE:=" include/version.mk | cut -d'=' -f2 | tr -cd '0-9.' | head -c 10)
        FULL_VER="${FULL_VER:-SNAPSHOT}"
        SHORT_VER=$(echo "$FULL_VER" | cut -d'.' -f1,2)
        echo "OWRT_REAL_VERSION=$FULL_VER" >> $GITHUB_ENV
        echo "OWRT_VER_SHORT=$SHORT_VER" >> $GITHUB_ENV
        
        [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ] && chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH" && "$GITHUB_WORKSPACE/$DIY_P1_SH"
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        [ -d "$GITHUB_WORKSPACE/files" ] && mv "$GITHUB_WORKSPACE/files" files
        [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ] && chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH" && "$GITHUB_WORKSPACE/$DIY_P2_SH"

        echo "🔍 正在全盘扫描并解锁 Go 工具链限制..."
        find . -type f -name "*.mk" -exec grep -l "GOTOOLCHAIN=local" {} + | xargs -r sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/g'
        echo "✅ 所有潜在的 Go 工具链限制已动态解除"
        
        RAW_IP=$(grep -oE "((192\.168|10\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]+\.[0-9]+)" package/base-files/files/bin/config_generate | head -n1)
        FINAL_IP="${RAW_IP:-192.168.1.1}"
        echo "DEFAULT_IP=$FINAL_IP" >> $GITHUB_ENV

        echo "=========================================="
        echo "✅ 识别到源码版本: $FULL_VER"
        echo "✅ 匹配设备 ID: ${{ env.TARGET_ID }}"
        echo "✅ 默认后台地址: $FINAL_IP"
        echo "✅ 仓库识别码: ${{ env.REPO_HASH }}"
        echo "=========================================="

        echo "CONFIG_CCACHE=y" >> .config
        make defconfig
        
        echo "⏳ 正在尝试多线程下载 (j8)..."
        if ! make download -j8; then
          echo "⚠️ j8 失败，降级至 j4 重试..."
          if ! make download -j4; then
            echo "❌ j4依然失败，进入单线程详细日志模式 (V=s)..."
            make download -j1 V=s > download.log 2>&1 || {
              tail -n 500 download.log
              exit 1
            }
          fi
        fi
        echo "✅ 源码下载成功"
        
        # 🧹 缓存极限清理
        rm -rf dl/go-mod-cache dl/cargo
        [ -f "scripts/clean-dl.sh" ] && ./scripts/clean-dl.sh || true
        find dl -mindepth 1 -size -1024c -delete 2>/dev/null || true
        
        # 对 dl 缓存结构的日志监控
        echo "📊 dl 目录缓存体积前 5 排行:"
        (du -h dl/* 2>/dev/null | sort -rh | head -n 5) 2>/dev/null || echo "dl 目录为空"
        echo "=========================================="

        # --- 整合 luci-app-honk 的宿主机编译环境依赖（支持大范围智能搜索） ---
        echo "🔧 正在全局搜索并配置 luci-app-honk 所需的宿主机工具链..."
        
        # 1. 安装 Rust 环境（如果尚未安装）
        if ! command -v rustup &> /dev/null; then
          curl --retry 3 --retry-delay 2 --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        
        # 2. 在全仓库范围内寻找 honk_toolchain.sh 脚本
        HONK_TOOLCHAIN_PATH=""
        for candidate in \
          "package/luci-app-honk/honk_toolchain.sh" \
          "package/luci-app-honk/honk/honk_toolchain.sh" \
          "feeds/luci/applications/luci-app-honk/honk_toolchain.sh"; do
          if [ -f "$candidate" ]; then
            HONK_TOOLCHAIN_PATH="$candidate"
            break
          fi
        done
        
        # 如果精准路径未命中，使用 find 进行全盘递归扫描
        if [ -z "$HONK_TOOLCHAIN_PATH" ]; then
          echo "🔍 常规路径未命中，正在全盘扫描 honk_toolchain.sh..."
          HONK_TOOLCHAIN_PATH=$(find . -type f -name "honk_toolchain.sh" | head -n 1)
        fi
        
        # 3. 如果找到了脚本，则自动执行并安装依赖
        if [ -n "$HONK_TOOLCHAIN_PATH" ] && [ -f "$HONK_TOOLCHAIN_PATH" ]; then
          HONK_DIR=$(dirname "$HONK_TOOLCHAIN_PATH")
          echo "✅ 成功找到 honk 工具链脚本: $HONK_TOOLCHAIN_PATH (所在目录: $HONK_DIR)"
          
          # 执行解析脚本获取版本号
          eval "$(bash "$HONK_TOOLCHAIN_PATH")"
          
          # 安装 bpf-linker
          echo "📦 正在安装 bpf-linker v${BPF_LINKER_VERSION}..."
          curl --retry 3 --retry-delay 2 -fsSL -o /tmp/bpf-linker.tar.zst "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${BPF_LINKER_SHA256}  /tmp/bpf-linker.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/bpf-linker.tar.zst -C /usr/local/bin
          
          # 安装 Zig 编译器
          echo "📦 正在安装 Zig v${ZIG_VERSION}..."
          curl --retry 3 --retry-delay 2 -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          sudo ln -sf "/usr/local/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          echo "✅ honk 专用宿主机工具链安装完成！"
        else
          echo "⚠️ 全盘未检测到 honk_toolchain.sh 脚本，跳过专用工具链安装。"
        fi
        # ---------------------------------------------

    - name: 9. 开始编译
      id: compile
      run: |
        cd "${{ env.OPENWRT_PATH }}"
        echo "DATE=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_ENV
        
        THREADS=$(nproc)
        echo "🚀 首次尝试线程数: $THREADS"
        make -j$THREADS FORCE_UNSAFE_CONFIGURE=1 || {
          echo "⚠️ 多线程爆内存或冲突失败，正在以单线程重试 (日志已转存以防崩溃)..."
          make -j1 V=s FORCE_UNSAFE_CONFIGURE=1 > build.log 2>&1 || {
            tail -n 2000 build.log
            echo "❌ 编译彻底失败，详细原因请查看上述日志尾部。"
            exit 1
          }
        }
        
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 10. 整理产物
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd "${{ env.OPENWRT_PATH }}"
        mkdir -p $GITHUB_WORKSPACE/outputs
        find bin/targets -type f -name "${{ env.TARGET_PATTERN }}" ! -name "*.json" ! -name "*.manifest" -exec cp -v {} $GITHUB_WORKSPACE/outputs/ \;
        cd $GITHUB_WORKSPACE/outputs
        if [ -n "$(ls -A . 2>/dev/null)" ]; then
          sha256sum * > SHA256SUMS
          echo "has_artifacts=true" >> $GITHUB_OUTPUT
        else
          echo "has_artifacts=false" >> $GITHUB_OUTPUT
        fi

    - name: 11. 备份固件到 Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && steps.organize.outputs.has_artifacts == 'true'
      with:
        name: OpenWrt_firmware_${{ env.TARGET_ID }}_${{ env.OWRT_REAL_VERSION }}
        path: ${{ github.workspace }}/outputs/
        retention-days: 7

    - name: 12. 发布 Release 并自动清理
      if: steps.compile.outputs.status == 'success' && steps.organize.outputs.has_artifacts == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "${{ env.OPENWRT_PATH }}"
        TARGET_BOARD=$(grep "CONFIG_TARGET_BOARD=" .config | cut -d'=' -f2 | tr -d '"')
        TARGET_SUBTARGET=$(grep "CONFIG_TARGET_SUBTARGET=" .config | cut -d'=' -f2 | tr -d '"')
        
        DEVICE="${{ env.TARGET_ID }}"
        VERSION="${{ env.OWRT_REAL_VERSION }}"
        TAG="${DEVICE}-v${VERSION}-b${{ github.run_number }}-$(date +%Y%m%d%H%M)"
        
        TOTAL_BODY="🏷️ 版本: ${VERSION} | 📅 源码日期: ${{ env.COMMIT_DATE }} | 🏗️ 架构: ${TARGET_BOARD}/${TARGET_SUBTARGET} | 🌐 IP: ${{ env.DEFAULT_IP }}"
        
        cd $GITHUB_WORKSPACE/outputs
        gh release create "$TAG" ./* --title "R${{ env.DATE }} - ${DEVICE}" --notes "$TOTAL_BODY"
        
        echo "=========================================="
        echo "🧹 正在清理设备 [${DEVICE}] 的旧 Release 版本..."
        OLD_RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep "^${DEVICE}-" | tail -n +4)
        
        if [ -n "$OLD_RELEASES" ]; then
          for rel in $OLD_RELEASES; do
            echo "🗑️ 正在尝试删除旧版本: $rel"
            gh release delete "$rel" --yes --cleanup-tag || true
          done
          echo "✅ Release 清理完成"
        else
          echo "✨ 历史版本不多，跳过清理。"
        fi
        echo "=========================================="

    - name: 13. 清理同设备旧缓存 (Caches)
      if: always() && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=========================================="
        echo "🧹 正在清理旧缓存..."
        
        clean_cache() {
          local TYPE=$1
          local KEYWORD=$2
          local TARGET_MATCH=${3:-${{ env.TARGET_ID }}} 
          local RETAIN_COUNT=${4:-1}
          
          echo "▶️ 开始检查 $TYPE 缓存..."
          
          JQ_QUERY=".[] | select(.key | contains(\"$TARGET_MATCH\") and contains(\"$KEYWORD\")) | .key"
          CACHE_KEYS=$(gh cache list --limit 500 --json key,createdAt -q "sort_by(.createdAt) | reverse | $JQ_QUERY" || true)
          
          if [ -n "$CACHE_KEYS" ]; then
            CACHE_ARRAY=($CACHE_KEYS)
            
            if [ ${#CACHE_ARRAY[@]} -le $RETAIN_COUNT ]; then
              echo "✨ $TYPE 历史缓存数量未超限，无需清理。"
              return
            fi
            
            echo "📊 发现 ${#CACHE_ARRAY[@]} 个匹配项，准备清理多余的 $((${#CACHE_ARRAY[@]} - RETAIN_COUNT)) 个旧缓存..."
            
            for ((i=$RETAIN_COUNT; i<${#CACHE_ARRAY[@]}; i++)); do
              cache_key="${CACHE_ARRAY[$i]}"
              echo "🗑️ 尝试删除旧缓存: $cache_key"
              gh cache delete "$cache_key" || echo "⚠️ 无法删除: (可能被当前 Workflow 锁定，这属于正常现象，将在下次运行时删除)"
            done
          else
            echo "🔍 未发现历史 $TYPE 缓存"
          fi
        }
        
        clean_cache "dl源码" "-global-${{ env.REPO_BRANCH }}-dl-" "global" 0
        
        clean_cache "feeds目录" "-feeds-"
        clean_cache "ccache编译" "-cache-"
        
        echo "✅ 缓存清理步骤结束"
        echo "=========================================="
